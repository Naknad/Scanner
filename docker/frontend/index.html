<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Своё Вино — Сканер этикеток</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="logo">Своё <span>Вино</span></div>
    <div class="subtitle">Наведите камеру на этикетку — узнайте вино за секунды</div>
  </header>

  <div class="card-panel">
    <div id="uploadZone" class="upload-zone">
      <svg viewBox="0 0 24 24"><path d="M12 2c-1.1 0-2 .9-2 2v.1C7.6 4.6 6 6.6 6 9v7c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V9c0-2.4-1.6-4.4-4-4.9V4c0-1.1-.9-2-2-2zm0 4c1.7 0 3 1.3 3 3v7H9V9c0-1.7 1.3-3 3-3z"/></svg>
      <div><strong>Сфотографируйте этикетку</strong><br>или выберите фото из галереи</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
    <img id="preview" alt="предпросмотр этикетки">

    <div class="actions-row">
      <button class="btn btn-primary" id="takePhotoBtn">📷 Снять фото</button>
      <button class="btn btn-outline" id="chooseFileBtn">🖼 Из галереи</button>
    </div>
    <div class="actions-row" id="scanRow" style="display:none">
      <button class="btn btn-primary" id="scanBtn">Распознать вино</button>
    </div>

    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="card-panel" id="resultPanel" style="display:none"></div>

  <div class="hint">MVP-версия · распознавание по OCR-тексту этикетки</div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
